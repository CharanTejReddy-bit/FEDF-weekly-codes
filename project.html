<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Ingredient Mapper</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f5efe7;
margin:0;
padding:0;
text-align:center;
}

.container{
width:90%;
max-width:1100px;
margin:auto;
padding:20px;
}

h1{
font-size:40px;
margin-bottom:5px;
}

.subtitle{
color:gray;
margin-bottom:30px;
}

.search-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input{
width:80%;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
margin-bottom:10px;
}

.filters button{
padding:8px 15px;
border:none;
border-radius:6px;
margin:5px;
cursor:pointer;
background:#eee;
}

.filters button.active{
background:#e36414;
color:white;
}

.recipes{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:left;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.badge{
position:absolute;
background:#28a745;
color:white;
padding:4px 8px;
border-radius:10px;
font-size:12px;
top:10px;
right:10px;
}

.image-container{
position:relative;
}

.match{
background:#ffe5d0;
color:#e36414;
font-size:12px;
padding:4px 8px;
border-radius:10px;
display:inline-block;
margin-bottom:5px;
}

.recipe-info{
color:gray;
font-size:14px;
margin:5px 0;
}

.ingredients span{
background:#f1f1f1;
padding:4px 6px;
border-radius:6px;
margin:2px;
display:inline-block;
font-size:12px;
}

.view{
color:#e36414;
margin-top:10px;
display:inline-block;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h1>Smart Ingredient Mapper</h1>
<p class="subtitle">Enter the ingredients you have and discover delicious recipes you can make right now.</p>

<div class="search-box">

<h3>🔎 Find Recipes</h3>

<input type="text" id="ingredientInput" placeholder="Type ingredients you have...">

<div class="filters">
<button class="active">All Diets</button>
<button>Vegetarian</button>
<button>Non-Veg</button>

<br>

<button class="active">Any Time</button>
<button>&lt; 15m</button>
<button>15-30m</button>
<button>&gt; 30m</button>
</div>

</div>

<div class="recipes" id="recipeList">

</div>

</div>

<script>

const recipes = [

{
name:"Classic Margherita Pizza",
time:"25m",
servings:"4",
difficulty:"Medium",
type:"Veg",
ingredients:["flour","tomato","mozzarella","basil","olive oil"],
image:"https://images.unsplash.com/photo-1604382354936-07c5d9983bd3"
},

{
name:"Chicken Stir-Fry",
time:"20m",
servings:"3",
difficulty:"Easy",
type:"Non-Veg",
ingredients:["chicken","bell pepper","soy sauce","garlic","ginger","onion"],
image:"https://images.unsplash.com/photo-1604908176997-431ba5f9c7e7"
},

{
name:"Creamy Mushroom Pasta",
time:"18m",
servings:"2",
difficulty:"Easy",
type:"Veg",
ingredients:["pasta","mushroom","cream","garlic","parmesan"],
image:"https://images.unsplash.com/photo-1621996346565-e3dbc353d2e5"
}

];

const recipeList = document.getElementById("recipeList");

function displayRecipes(){

recipeList.innerHTML="";

recipes.forEach(recipe=>{

const card = document.createElement("div");
card.className="card";

card.innerHTML=`

<div class="image-container">
<img src="${recipe.image}">
<div class="badge">${recipe.type}</div>
</div>

<div class="card-content">

<div class="match">0% match</div>

<h3>${recipe.name}</h3>

<div class="recipe-info">
⏱ ${recipe.time} | 🍽 ${recipe.servings} | ${recipe.difficulty}
</div>

<div class="ingredients">
${recipe.ingredients.map(i=>`<span>${i}</span>`).join("")}
</div>

<div class="view">View recipe →</div>

</div>

`;

recipeList.appendChild(card);

});

}

displayRecipes();

</script>

</body>
</html>
